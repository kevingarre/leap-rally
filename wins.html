<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>LEAP CHARGE · Gewinn-Codes</title>
  <style>
    @font-face { font-family:'Montserrat'; src:url('assets/brand/Montserrat-Black.ttf') format('truetype'); font-weight:900; font-display:block; }
    @font-face { font-family:'Montserrat'; src:url('assets/brand/Montserrat-ExtraBold.ttf') format('truetype'); font-weight:800; font-display:block; }
    @font-face { font-family:'Montserrat'; src:url('assets/brand/Montserrat-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
    :root { --lm-green:#67C23A; --lm-bg:#0a0a0f; --lm-card:#111118; --lm-grey:rgba(255,255,255,0.45); --font:'Montserrat',sans-serif; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--lm-bg); color:#fff; font-family:var(--font); min-height:100vh; }

    /* PIN overlay */
    #pin-overlay { position:fixed; inset:0; background:var(--lm-bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; z-index:100; padding:24px; }
    .pin-logo { height:48px; filter:invert(1) brightness(2); }
    .pin-title { font-size:20px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
    .pin-dots { display:flex; gap:10px; }
    .pin-dot { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,0.15); border:1.5px solid rgba(255,255,255,0.25); transition:background .15s; }
    .pin-dot.filled { background:var(--lm-green); border-color:var(--lm-green); }
    .pin-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:240px; }
    .pin-key { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; font-size:20px; font-weight:900; color:#fff; cursor:pointer; text-align:center; transition:background .1s; }
    .pin-key:active { background:rgba(103,194,58,0.25); }
    .pin-error { color:#f66; font-size:13px; min-height:18px; text-align:center; }

    /* Main content */
    #main { display:none; max-width:600px; margin:0 auto; padding:20px 16px 40px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .page-title { font-size:20px; font-weight:900; }
    .back-link { color:var(--lm-green); font-size:13px; text-decoration:none; font-weight:700; }

    .filter-row { display:flex; gap:8px; margin-bottom:14px; }
    .filter-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:rgba(255,255,255,0.7); padding:8px 14px; font-size:12px; font-weight:700; font-family:var(--font); cursor:pointer; transition:background .15s; }
    .filter-btn.active { background:rgba(103,194,58,0.2); border-color:var(--lm-green); color:var(--lm-green); }

    .table-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead { background:rgba(255,255,255,0.04); }
    th { padding:10px 8px; text-align:left; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--lm-grey); border-bottom:1px solid rgba(255,255,255,0.08); }
    td { padding:12px 8px; border-bottom:1px solid rgba(255,255,255,0.05); vertical-align:middle; }
    tr:hover td { background:rgba(255,255,255,0.02); }
    .cell-code { font-size:16px; font-weight:900; color:var(--lm-green); letter-spacing:2px; }
    .cell-score { font-weight:800; }
    .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:800; }
    .badge-open { background:rgba(255,184,0,0.15); color:#FFB800; }
    .badge-claimed { background:rgba(103,194,58,0.15); color:var(--lm-green); }
    .btn-claim { background:var(--lm-green); border:none; border-radius:8px; color:#000; font-family:var(--font); font-size:12px; font-weight:900; padding:8px 14px; cursor:pointer; transition:opacity .15s; white-space:nowrap; }
    .btn-claim:hover { opacity:.85; }
    .btn-claim:disabled { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.35); cursor:default; }
    .msg-loading, .msg-empty, .msg-error { padding:20px; text-align:center; color:var(--lm-grey); font-size:14px; }
    .msg-error { color:#f66; }
    .summary-bar { background:rgba(255,255,255,0.04); border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:13px; color:var(--lm-grey); display:flex; gap:16px; }
    .summary-bar strong { color:#fff; }
    .wins-more-link { display:block; text-align:center; color:var(--lm-green); font-size:13px; font-weight:700; padding:12px; text-decoration:none; }
  </style>
</head>
<body>

<!-- PIN Overlay -->
<div id="pin-overlay">
  <img src="assets/brand/leapmotor-logo.svg" alt="Leapmotor" class="pin-logo">
  <div class="pin-title">Gewinn-Codes</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div id="pin-error" class="pin-error"></div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key" onclick="pinKey('')" style="color:rgba(255,255,255,0.3)">–</button>
    <button class="pin-key" onclick="pinKey('0')">0</button>
    <button class="pin-key" onclick="pinBack()">⌫</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div class="page-header">
    <div class="page-title">🎟 Gewinn-Codes</div>
    <a href="staff.html" class="back-link">← Staff Panel</a>
  </div>
  <div id="summary-bar" class="summary-bar">⏳ Lade…</div>
  <div class="filter-row">
    <button class="filter-btn active" id="filter-all" onclick="applyFilter('all')">Alle</button>
    <button class="filter-btn" id="filter-open" onclick="applyFilter('open')">Offen</button>
    <button class="filter-btn" id="filter-claimed" onclick="applyFilter('claimed')">Eingelöst</button>
  </div>
  <div id="wins-table"><div class="msg-loading">⏳ Lade Codes…</div></div>
</div>

<script src="js/supabase-config.js?v=20260715e"></script>
<script src="js/api.js?v=20260715e"></script>
<script>
var STAFF_PIN = '1234';
var currentEventId = null;
var allWins = [];
var currentFilter = 'all';

// ── PIN ──────────────────────────────────────────────────
var pinVal = '';
function pinKey(d) {
  if (!d) return;
  if (pinVal.length >= 4) return;
  pinVal += d;
  updateDots();
  if (pinVal.length === 4) setTimeout(checkPin, 80);
}
function pinBack() { pinVal = pinVal.slice(0,-1); updateDots(); document.getElementById('pin-error').textContent = ''; }
function updateDots() {
  for (var i=0;i<4;i++) {
    document.getElementById('pd'+i).className = 'pin-dot' + (i < pinVal.length ? ' filled' : '');
  }
}
function checkPin() {
  if (pinVal === STAFF_PIN) {
    document.getElementById('pin-overlay').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadWins();
  } else {
    document.getElementById('pin-error').textContent = 'Falscher PIN';
    pinVal = ''; updateDots();
  }
}

// ── Data ─────────────────────────────────────────────────
function callRpc(fn, body) {
  var cfg = window.LEAP_SUPABASE;
  return fetch(cfg.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ 'apikey':cfg.anonKey, 'Authorization':'Bearer '+cfg.anonKey, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

function loadWins() {
  // Get active event first
  var cfg = window.LEAP_SUPABASE;
  fetch(cfg.url + '/rest/v1/events?is_active=eq.true&select=id,name&limit=1', {
    headers:{ 'apikey':cfg.anonKey, 'Authorization':'Bearer '+cfg.anonKey }
  }).then(function(r){ return r.json(); }).then(function(evs) {
    if (!evs || !evs.length) { document.getElementById('wins-table').innerHTML = '<div class="msg-empty">Kein aktives Event.</div>'; return; }
    currentEventId = evs[0].id;
    return callRpc('get_staff_wins', { p_event_id: currentEventId, p_staff_pin: STAFF_PIN });
  }).then(function(data) {
    if (!data) return;
    allWins = Array.isArray(data) ? data : (data ? [data] : []);
    var total   = allWins.length;
    var claimed = allWins.filter(function(w){ return !!w.claimed_at; }).length;
    var open    = total - claimed;
    document.getElementById('summary-bar').innerHTML =
      '<strong>' + total + '</strong> Gesamt &nbsp;·&nbsp; ' +
      '<strong style="color:#FFB800">' + open + '</strong> Offen &nbsp;·&nbsp; ' +
      '<strong style="color:#67C23A">' + claimed + '</strong> Eingelöst';
    renderTable();
  }).catch(function(e) {
    document.getElementById('wins-table').innerHTML = '<div class="msg-error">⚠️ ' + e.message + '</div>';
  });
}

function applyFilter(f) {
  currentFilter = f;
  ['all','open','claimed'].forEach(function(k){
    document.getElementById('filter-'+k).className = 'filter-btn' + (k===f?' active':'');
  });
  renderTable();
}

function renderTable() {
  var list = allWins.filter(function(w){
    if (currentFilter === 'open')    return !w.claimed_at;
    if (currentFilter === 'claimed') return !!w.claimed_at;
    return true;
  });

  if (!list.length) {
    document.getElementById('wins-table').innerHTML = '<div class="msg-empty">Keine Einträge.</div>';
    return;
  }

  var html = '<div class="table-scroll"><table><thead><tr>' +
    '<th>Code</th><th>Spieler</th><th>Score</th><th>Zeit</th><th>Status</th><th>Aktion</th>' +
    '</tr></thead><tbody>';

  list.forEach(function(row) {
    var code    = row.claim_code || '–';
    var pName   = ((row.first_name||'') + ' ' + (row.last_name||'')).trim() || '–';
    var ts      = row.created_at ? new Date(row.created_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) : '–';
    var claimed = !!row.claimed_at;
    var clTs    = row.claimed_at ? new Date(row.claimed_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) : '';
    var score   = (row.score||0).toLocaleString('de-DE');

    var statusBadge = claimed
      ? '<span class="badge badge-claimed">✓ ' + (clTs||'Eingelöst') + '</span>'
      : '<span class="badge badge-open">Offen</span>';

    var actionBtn = claimed
      ? '<button class="btn-claim" disabled>✓</button>'
      : '<button class="btn-claim" onclick="claimWin(\'' + code.replace(/'/g,"\\'") + '\',this)">Einlösen</button>';

    html += '<tr><td class="cell-code">' + code + '</td><td>' + pName + '</td>' +
      '<td class="cell-score">' + score + '</td><td>' + ts + '</td>' +
      '<td>' + statusBadge + '</td><td>' + actionBtn + '</td></tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('wins-table').innerHTML = html;
}

function claimWin(code, btn) {
  if (!confirm('Code "' + code + '" als eingelöst markieren?')) return;
  btn.disabled = true; btn.textContent = '⏳';
  callRpc('claim_instant_win', { p_code: code, p_event_id: currentEventId, p_staff_pin: STAFF_PIN })
    .then(function(result) {
      if (result === true || result === 'true') {
        loadWins();
      } else {
        alert('Code nicht gefunden oder bereits eingelöst.');
        btn.disabled = false; btn.textContent = 'Einlösen';
      }
    }).catch(function(e) {
      alert('Fehler: ' + e.message);
      btn.disabled = false; btn.textContent = 'Einlösen';
    });
}
</script>
</body>
</html>
