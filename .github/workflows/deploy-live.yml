name: Deploy Live (main → gh-pages root)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove internal files before deploy
        run: |
          rm -f MEMORY.md README-BACKUP.md backup-worker.js setup-backup-cron.sh
          rm -rf docs supabase .git

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: .
          keep_files: true
          commit_message: 'deploy: live from main (${{ github.sha }})'

      - name: Copy files to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 88.198.104.87
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "."
          target: /var/www/leapmotor-tt
          strip_components: 0
          overwrite: true

      - name: Post-deploy on Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: 88.198.104.87
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Permissions
            find /var/www/leapmotor-tt -type f -exec chmod 644 {} \;
            find /var/www/leapmotor-tt -type d -exec chmod 755 {} \;
            chown -R root:root /var/www/leapmotor-tt
            echo "staff.html: $(wc -c < /var/www/leapmotor-tt/staff.html) bytes"
            echo "staff.js:   $(wc -c < /var/www/leapmotor-tt/js/staff.js) bytes"
            # nginx: Lese-RPCs aus leap_staff (burst=3) raus — exakter String-Tausch
            F=/etc/nginx/sites-enabled/leap-api
            cp $F $F.bak
            # Exakte Zeile aus der Config (verifiziert via Log 2026-08-31 09:21):
            OLD='get_event_export|get_all_events_staff|get_staff_wins|get_event_analytics|archive_and_new_event|update_event|claim_instant_win'
            # Neu: nur echte Schreib-RPCs bleiben in leap_staff
            NEW='archive_and_new_event|update_event|claim_instant_win'
            python3 -c "
import sys
old = '$OLD'
new = '$NEW'
f = '$F'
txt = open(f).read()
if old in txt:
    open(f,'w').write(txt.replace(old, new))
    print('GEPACHT')
else:
    print('KEIN MATCH — Config hat sich geaendert:', [l.strip() for l in txt.splitlines() if 'rpc/' in l and 'leap_staff' in txt[max(0,txt.find(l)-200):txt.find(l)+200]])
    sys.exit(1)
"
            echo "=== Zeile nach Patch ==="
            grep 'archive_and_new_event\|get_event_analytics' $F
            nginx -t && systemctl reload nginx && echo "nginx: OK"
            # PostgREST reload
            kill -SIGUSR1 $(pgrep -x postgrest | head -1) 2>/dev/null && echo "postgrest: OK"
            echo "DONE"
