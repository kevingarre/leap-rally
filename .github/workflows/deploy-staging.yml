name: Deploy Staging (dev → gh-pages/staging)

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove internal files before deploy
        run: |
          rm -f MEMORY.md README-BACKUP.md backup-worker.js setup-backup-cron.sh
          rm -rf docs supabase .git

      - name: Deploy to gh-pages/staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: staging
          keep_files: true
          commit_message: 'deploy: staging from dev (${{ github.sha }})'
